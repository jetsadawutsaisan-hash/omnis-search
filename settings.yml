# ==========================================
# OMNIS-COURT SearXNG Settings
# Over-fetch: 80-100 URLs per query
# Philosophy: Over-fetch → Filter later
# ==========================================

use_default_settings: true

general:
  instance_name: "OMNIS-SEARCH"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  
  # 🔥 OMNIS-COURT: Over-fetch configuration
  formats:
    - html
    - json
  
  # จำกัดจำนวนผลลัพธ์สูงสุดต่อ query
  max_page: 0  # ไม่จำกัด

server:
  secret_key: "omnis_court_secret_key_change_me_12345"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  # 🔥 Allow large JSON responses
  method: "GET"

ui:
  static_use_hash: true
  default_theme: simple
  results_on_new_tab: false

outgoing:
  # 🔥 OMNIS-COURT: Higher timeouts for deep crawling
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # ==========================================
  # TIER 1: MAINSTREAM ENGLISH NEWS (Priority)
  # ==========================================
  - name: google news
    engine: google_news
    shortcut: gon
    disabled: false
    weight: 1.5
    timeout: 8.0
    
  - name: bing news
    engine: bing_news
    shortcut: bin
    disabled: false
    weight: 1.3
    timeout: 8.0
    
  - name: yahoo news
    engine: yahoo_news
    shortcut: yhn
    disabled: false
    weight: 1.2
    timeout: 8.0
    
  - name: duckduckgo news
    engine: duckduckgo
    shortcut: ddn
    disabled: false
    category: news
    weight: 1.0
    timeout: 8.0
    
  # ==========================================
  # TIER 2: NATIVE LANGUAGE SOURCES (Polyglot)
  # ==========================================
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    weight: 0.8
    timeout: 6.0
    
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false
    weight: 0.5
    timeout: 6.0
    
  # Spanish (Marca, AS, etc. via general web)
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    weight: 1.0
    timeout: 8.0
    
  # ==========================================
  # TIER 3: GENERAL WEB (Forums, Blogs, Stats sites)
  # ==========================================
  - name: google
    engine: google
    shortcut: gog
    disabled: false
    weight: 1.0
    timeout: 8.0
    
  - name: bing
    engine: bing
    shortcut: big
    disabled: false
    weight: 0.9
    timeout: 8.0
    
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    weight: 1.0
    timeout: 8.0
    
  - name: reddit
    engine: reddit
    shortcut: red
    disabled: false
    weight: 1.2
    timeout: 10.0
    
  # ==========================================
  # TIER 4: SPECIALIST TENNIS SOURCES (via web search)
  # ==========================================
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
    weight: 0.8
    timeout: 8.0

# 🔥 OMNIS-COURT: Category weights for multi-source fetching
categories_as_tabs:
  general:
    - general
  news:
    - news
  sports:
    - general
    - news
